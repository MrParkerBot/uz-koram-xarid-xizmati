# Lint configuration for the Uz-Koram Xarid Xizmati application.
#
# The rule set is listed explicitly rather than relying on ruff's defaults, so
# that upgrading ruff cannot silently change what the pull request gate enforces.

line-length = 88
target-version = "py312"

exclude = [
    ".venv",
    "venv",
    "staticfiles",
    # Generated by Django; rewriting it by hand is how migrations get broken.
    "**/migrations/*",
]

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import ordering
    "UP",  # outdated syntax for the Python version we target
    "B",   # bugbear: likely bugs rather than style
    "SIM", # simplifiable constructs
    "DJ",  # Django-specific pitfalls
    "C4",  # comprehension misuse
]

[lint.per-file-ignores]
# Django's settings module is a flat list of module-level constants by design.
"config/settings.py" = ["E501"]

[lint.isort]
known-first-party = ["config"]
